# live-translate-ocr 配置
#
# 改完重启生效。全部键都可以不写——不写就是这里的默认值。
# 唯一的例外是 [capture] region：没框选过就不知道去哪抓字幕，程序会提示你先框选
# （首次运行 run.bat 会自动把这份文件复制成 config.toml 并帮你框）。
#
# 这份文件是给手改的，注释请随意保留——程序的"记住框选结果"只会重写 region 那一行。


# ============================================================ 抓屏幕
[capture]
# 字幕区域 [x, y, w, h]，屏幕物理像素。程序会自己写这一行，一般不用手改。
# 全 0 = 还没框选过。
#   换窗口、改分辨率、改浏览器缩放之后，按 Ctrl+Alt+R 重新框一次。
# 框选要领：**只框字幕带本身**，别把进度条、标题、CC 按钮框进来。
# 框紧一点反而更快——识别引擎会为了看清小字而放大图片，框得越紧越省时间。
region = [0, 0, 0, 0]

# 每秒抓几次。字幕在屏幕上停留 1~3 秒，3 Hz 已经够密——每条字幕能采 3~9 次，
# 而判"这一行定型了"只要连续读到 2 次。
#
# 为什么是 3 不是 4：本机实测一次识别单行 168ms、两行 254ms（中位，1600 宽紧框，
# 最慢 399ms），而**两行是常态**。4 Hz 的预算是 250ms，正好卡在两行的耗时上，
# 结果是识别线程一直满载、白吃一个核，字幕却一次也没多采。3 Hz 预算 333ms，有余量。
# 这个工具是开着游戏或直播用的，抢 CPU 的代价比多采两帧大。
fps = 3.0

# 连续读不到字超过这么久，就把频率降到 fps_idle 省点电。
# 广告、暂停、没开字幕的时候占大多数时间。
idle_after_s = 2.0
fps_idle = 2.0

# 多屏时抓哪块屏（mss 的编号：0 = 所有屏拼起来的虚拟屏，1 = 第一块…）
monitor = 0


# ============================================================ 认字
[ocr]
# 目前只有 rapidocr。下面这两个键**没接线**，改了也不会生效，留着是为了记住
# 当初评估过什么（详见 livetranslate_ocr/ocr.py 的文件头）：
#   engine = "windows"  → 系统自带 OCR 要常驻一个 PowerShell 子进程走 WinRT，
#                         那套管道没验证过，没做。
#   lang = "en"         → 英文专用识别模型要联网下载，而且实测并不比默认模型准。
#                         默认模型认英文的置信度实测 0.99~1.00，够用。
engine = "rapidocr"
lang = "en"
# 低于这个置信度的行直接丢掉。字幕是白字黑底，正常都在 0.9 以上；
# 掉到 0.6 以下的通常是背景花纹被误认成了字。
min_confidence = 0.6
# 最多取几行。框选时可能多框进来一点东西，多出来的行不要。
max_lines = 3


# ============================================================ 拼句（本项目最容易出问题的地方）
[captions]
# 一行文本连续读到几次完全一样才算"定型"。1 = 读到就发（会抖），3 = 更稳但慢一拍。
stable_reads = 2
# 攒到这么长就强制发出去，防止一句话太长迟迟不结束（一个字幕行能到 90 字符）
max_chars = 90
# 字幕整块消失超过这么久，判定这句说完了
idle_emit_s = 1.0
# 太短的读数直接丢（1 个字母、纯符号），基本都是误认
min_chars = 2
# 判定"还是同一条字幕"的相似度阈值。只在两次读数**长度接近**时才用它容忍抖动——
# 判断"又长了几个词"真正靠的是前缀关系。别往低调：不同句子也可能很像。
scroll_similarity = 90
# 最后一行定型后最多再等这么久就发。自动字幕经常整句都没有句末标点，
# 光等标点会一直不发；这个上限保证最坏情况下的延迟不超过它。
max_hold_s = 2.5
# 一句话从出现到强制切分的硬上限，兜底语速极快、"一直在长、每帧都不一样"的情况
max_wait_s = 3.0


# ============================================================ 两个词典
[dictionaries]
# 第一区：游戏专业术语。两个用途：
#   ① 命中后连说明一起注入 prompt，让模型照用通行译法（"残局"而不是"抓娃娃机"）
#   ② 没网时整条替换（用第三列的短词形；没有第三列就保留英文原文）
terms = "data/terms.tsv"
# 第二区：英语日常高频词。**只服务没网时的兜底**——模型本来就认识 "the"/"and"，
# 把它们当术语注进 prompt 只会稀释真正重要的术语权重。
common = "data/common.tsv"
# 没网时逐词直译的最低实词覆盖率。低于它宁可显示英文原句，
# 也不要吐一堆中英夹杂的怪话——那会让人以为程序坏了。
min_coverage = 0.55


# ============================================================ 翻译模型
[llm]
# 任何 OpenAI 兼容端点都行：DeepSeek / OpenAI / Moonshot / 通义兼容模式 /
# 本地 Ollama(http://localhost:11434/v1) / LM Studio / vLLM
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
# 不推荐把 key 写在这里（这个文件可能被分享出去），优先用下面的环境变量。
api_key = ""
api_key_env = "DEEPSEEK_API_KEY"
# 略高一点口语化更自然；太高会开始自由发挥
temperature = 0.35
# 单句翻译总预算，超时就用已经流出来的部分
timeout_s = 12.0
# max_tokens = 源文本长度 × 该系数 + 32，防止模型话痨
max_tokens_factor = 2.5
max_tokens_cap = 512


# ============================================================ 翻译行为
[translate]
# 屏幕字幕固定是英文，不用自动检测
src_lang = "en"
dst_lang = "zh"                  # zh / zh-TW / en / ja / ko / ru / es ...
# 风格描述会直接进 system prompt，可以按主播类型微调
style = "口语化"
# 送给模型的上一句/上几句，越多越连贯但越慢
context_lines = 4
# 每次最多注入几条术语，太多会干扰模型
glossary_max_terms = 6


# ============================================================ 没网的时候怎么办
[offline]
# 连续失败几次判定为"离线态"。1 次太敏感（偶发超时会误判），2 次比较稳。
# 填 0 或负数 = 永不降级，每句话都硬去试模型。
fail_threshold = 2
# 离线态下每隔多久拿当前这句试探性重试一次，成功就自动切回模型
retry_interval_s = 30.0


# ============================================================ 翻译记忆库
[tm]
enabled = true
db = "data/tm.sqlite3"
# 模糊命中阈值（0-100）。低于 100 的命中会跳过缓存写入检查
fuzzy_threshold = 93
max_memory_entries = 50000
cache_context_dependent = false
write_min_chars = 2


# ============================================================ 字幕窗
[overlay]
font_family = "Microsoft YaHei UI"
font_size = 26
orig_font_size = 15
show_original = true             # 同时显示识别到的英文原文
opacity = 0.72                   # 字幕框背景不透明度
width_ratio = 0.74               # 占屏幕宽度比例

# 贴哪。**默认值是故意的**：老版字幕窗贴底，而字幕带就在底部，
# 会把要识别的东西盖住，等于自己吃自己。above_region 贴在框选区域正上方。
#   above_region = 采集区域正上方（推荐）    top = 贴屏幕顶    bottom = 贴屏幕底
anchor = "above_region"
anchor_gap = 20                  # above_region 时与采集区域留的空隙
bottom_margin = 90               # anchor = bottom 时才用

padding = 18
line_spacing = 8
hide_after_s = 7.0               # 静默多久后自动隐藏
show_latency = true              # 右下角显示识别/翻译耗时，调参用
start_clickthrough = false       # 启动时点击穿透（穿透后拖不动，用热键切回来）


# ============================================================ 热键
[hotkeys]
enabled = true
toggle_show = "ctrl+alt+s"           # 显示/隐藏字幕窗
toggle_clickthrough = "ctrl+alt+c"   # 点击穿透开关
toggle_original = "ctrl+alt+d"       # 显示/隐藏英文原文那一行
pause = "ctrl+alt+p"                 # 暂停抓屏（暂停期间不识别、不翻译）
repick_region = "ctrl+alt+r"         # 重新框选字幕区域
font_up = "ctrl+alt+up"
font_down = "ctrl+alt+down"
quit = "ctrl+alt+q"


# ============================================================ 日志
[log]
level = "INFO"                   # DEBUG 会打印每一帧读数，很吵，排查时才用
file = "logs/livetranslate-ocr.log"
